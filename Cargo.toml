[package]
name = "sessiondeck"
version = "1.1.0"
edition = "2024"
license = "AGPL-3.0-only"
build = "build.rs"

[[bin]]
name = "SessionDeck"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
fs2 = "0.4"
sysinfo = "0.40"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
