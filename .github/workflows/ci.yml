name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  # Refresh the main cache before GitHub removes caches idle for seven days.
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  build-and-test:
    name: Build and test (Windows x64)
    needs: changes
    # Keep the required check visible; a skipped workflow would leave it pending.
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build == 'true')
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Require successful path detection
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'Changed-path detection failed; refusing to bypass CI.'

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        shell: pwsh
        run: rustup toolchain install --no-self-update

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-msvc

      - name: Restore
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --release

      - name: Run self-tests
        run: cargo test --locked --release

      - name: Package portable executable
        shell: pwsh
        run: ./build.ps1
