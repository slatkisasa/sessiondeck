name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Temporarily skip this WIP branch; checks remain enabled elsewhere.
    if: github.head_ref != 'feat/rust-rewrite' && github.ref != 'refs/heads/feat/rust-rewrite'
    name: Detect documentation-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - name: Check changed paths
        id: changes
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('docs_only', 'false');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const isDocumentation = path => path.startsWith('docs/') || path.endsWith('.md');
            // The API returns at most 3,000 files. Build if the list may be incomplete.
            const docsOnly = files.length > 0 && files.length < 3000 && files.every(file =>
              isDocumentation(file.filename) &&
              (!file.previous_filename || isDocumentation(file.previous_filename)));
            core.setOutput('docs_only', String(docsOnly));

  build-and-test:
    name: Build and test (Windows x64)
    needs: changes
    # Keep the required check visible; a skipped workflow would leave it pending.
    if: github.head_ref != 'feat/rust-rewrite' && github.ref != 'refs/heads/feat/rust-rewrite' && (always() && needs.changes.outputs.docs_only != 'true')
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Require successful path detection
        if: needs.changes.result != 'success'
        shell: pwsh
        run: throw 'Changed-path detection failed; refusing to bypass CI.'

      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Rust
        shell: pwsh
        run: rustup update stable

      - name: Restore
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --release

      - name: Run self-tests
        run: cargo test --locked --release

      - name: Package portable executable
        shell: pwsh
        run: ./build.ps1
