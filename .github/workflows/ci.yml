name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          $pattern = '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          if ($env:PR_TITLE -cnotmatch $pattern) {
            Write-Error "PR title must use Conventional Commit format, for example: feat: add tray menu"
          }

      - name: Restore
        run: dotnet restore BNetSwitcher.csproj

      - name: Build
        run: dotnet build BNetSwitcher.csproj --configuration Release --no-restore

      - name: Run self-tests
        run: dotnet run --project BNetSwitcher.csproj --configuration Release --no-build -- --self-test

